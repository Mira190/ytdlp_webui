<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YT-DLP Web UI Downloader</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100">
    <div class="min-h-screen flex items-center justify-center p-4">
      <div class="w-full max-w-lg bg-white shadow-xl rounded-lg p-8">
        <!-- Language toggle button -->
        <div class="flex justify-end mb-4">
          <button
            id="toggleLangBtn"
            class="px-3 py-1 border text-sm rounded-lg bg-gray-200 hover:bg-gray-300"
          >
            Switch to Chinese
          </button>
        </div>
        <h1
          id="titleText"
          class="text-3xl font-bold text-center text-blue-600 mb-6"
        >
          YT-DLP Downloader
        </h1>
        {% if not ffmpeg_ok %}
        <!-- Text filled in by setLanguage() so it follows the language toggle -->
        <div
          id="ffmpegWarning"
          class="mb-4 p-3 rounded-lg bg-yellow-100 border border-yellow-300 text-yellow-800 text-sm"
        ></div>
        {% endif %}
        <form id="downloadForm" class="space-y-4">
          <div>
            <label
              id="labelUrl"
              for="url"
              class="block text-gray-700 font-medium"
              >Video URL</label
            >
            <input
              type="text"
              id="url"
              name="url"
              placeholder="Enter video URL"
              required
              class="mt-1 block w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
            />
          </div>
          <div>
            <label
              id="labelQuality"
              for="quality"
              class="block text-gray-700 font-medium"
              >Video Quality</label
            >
            <select
              id="quality"
              name="quality"
              class="mt-1 block w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
            >
              {% for opt in quality_options %}
              <option value="{{ opt }}">{{ opt|capitalize }}</option>
              {% endfor %}
            </select>
          </div>
          <div>
            <label
              id="labelFormat"
              for="file_format"
              class="block text-gray-700 font-medium"
              >File Format</label
            >
            <select
              id="file_format"
              name="file_format"
              class="mt-1 block w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
            >
              {% for fmt in format_options %}
              <option value="{{ fmt }}">
                {{ fmt|upper if fmt != 'default' else 'Default' }}
              </option>
              {% endfor %}
            </select>
          </div>
          <div class="flex items-center">
            <input
              type="checkbox"
              id="audio_only"
              name="audio_only"
              class="mr-2"
            />
            <label id="labelAudioOnly" for="audio_only" class="text-gray-700"
              >Audio Only (Convert to MP3)</label
            >
          </div>
          <div>
            <label
              id="labelDownloadDir"
              for="download_dir"
              class="block text-gray-700 font-medium"
              >Download Directory</label
            >
            <div class="flex">
              <input
                type="text"
                id="download_dir"
                name="download_dir"
                placeholder="e.g. C:\Downloads or /home/user/Downloads"
                class="mt-1 block w-full px-4 py-2 border rounded-l-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
              />
              <button
                type="button"
                id="chooseDirBtn"
                class="mt-1 px-4 py-2 bg-blue-500 text-white rounded-r-lg hover:bg-blue-600"
              >
                Choose
              </button>
            </div>
            <p class="text-sm text-gray-500 mt-1">
              If not supported, please manually enter the full path.
            </p>
          </div>
          <div>
            <button
              type="submit"
              id="submitBtn"
              class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-lg"
            >
              Start Download
            </button>
          </div>
        </form>
        <!-- Download progress area -->
        <div id="progressArea" class="mt-6 hidden">
          <label id="labelProgress" class="block text-gray-700 font-medium"
            >Download Progress</label
          >
          <progress
            id="progressBar"
            value="0"
            max="100"
            class="w-full"
          ></progress>
          <div id="progressText" class="text-gray-600 mt-2 text-center"></div>
        </div>
        <!-- Log output -->
        <div
          id="output"
          class="mt-6 p-4 bg-gray-50 border rounded text-gray-800 whitespace-pre-wrap"
        ></div>
      </div>
    </div>

    <script>
      // Format seconds into hh:mm:ss
      function formatTime(seconds) {
        let secNum = parseInt(seconds, 10);
        let hours = Math.floor(secNum / 3600);
        let minutes = Math.floor((secNum - hours * 3600) / 60);
        let secs = secNum - hours * 3600 - minutes * 60;
        return (
          (hours < 10 ? "0" + hours : hours) +
          ":" +
          (minutes < 10 ? "0" + minutes : minutes) +
          ":" +
          (secs < 10 ? "0" + secs : secs)
        );
      }

      // Simple i18n dictionary
      const i18n = {
        en: {
          title: "YT-DLP Downloader",
          linkLabel: "Video URL",
          qualityLabel: "Video Quality",
          formatLabel: "File Format",
          audioOnly: "Audio Only (Convert to MP3)",
          downloadDir: "Download Directory",
          startBtn: "Start Download",
          progressLabel: "Download Progress",
          switchTo: "Switch to Chinese",
          placeholderUrl: "Enter video URL",
          placeholderDir: "e.g. C:\\Downloads or /home/user/Downloads",
          downloading: "Downloading...",
          completed: "Download Completed",
          initializing: "Initializing...",
          errorPrefix: "Error: ",
          detailsLabel: "Technical details",
          jobNotFound:
            "Job not found — the app may have been restarted. Please try again.",
          ffmpegWarning:
            'ffmpeg was not found on this system. Merging video+audio, MP4/WebM/MKV output, and MP3 extraction will fail. <a class="underline font-medium" href="https://ffmpeg.org/download.html" target="_blank" rel="noopener">Download ffmpeg</a> and restart, or refresh this page after installing.',
          errorKinds: {
            ffmpeg_missing:
              "ffmpeg is required for this download but was not found. Install ffmpeg and try again.",
            drm: "This video is DRM-protected and cannot be downloaded.",
            unsupported_url: "This site or URL is not supported.",
            format_unavailable:
              "The requested quality/format is not available for this video.",
            network: "Network error — check your connection and try again.",
          },
        },
        zh: {
          title: "YT-DLP 下载器",
          linkLabel: "视频链接",
          qualityLabel: "视频质量",
          formatLabel: "下载格式",
          audioOnly: "仅下载音频（转为 MP3）",
          downloadDir: "下载目录",
          startBtn: "开始下载",
          progressLabel: "下载进度",
          switchTo: "切换到英语",
          placeholderUrl: "请输入视频链接",
          placeholderDir: "例如：C:\\Downloads 或 /home/user/Downloads",
          downloading: "下载中...",
          completed: "下载完成",
          initializing: "初始化...",
          errorPrefix: "错误：",
          detailsLabel: "技术细节",
          jobNotFound: "任务不存在——应用可能已重启，请重新提交下载。",
          ffmpegWarning:
            '未检测到 ffmpeg。合并音视频、MP4/WebM/MKV 输出和 MP3 提取将失败。请<a class="underline font-medium" href="https://ffmpeg.org/download.html" target="_blank" rel="noopener">下载 ffmpeg</a>后重启，或安装后刷新此页面。',
          errorKinds: {
            ffmpeg_missing: "此下载需要 ffmpeg，但未找到。请安装 ffmpeg 后重试。",
            drm: "该视频受 DRM 保护，无法下载。",
            unsupported_url: "不支持该网站或链接。",
            format_unavailable: "该视频没有所请求的清晰度/格式。",
            network: "网络错误——请检查网络连接后重试。",
          },
        },
      };

      let userLang = navigator.language || navigator.userLanguage;
      let currentLang = userLang.toLowerCase().startsWith("zh") ? "zh" : "en";

      function setLanguage(lang) {
        document.getElementById("titleText").innerText = i18n[lang].title;
        document.getElementById("labelUrl").innerText = i18n[lang].linkLabel;
        document.getElementById("labelQuality").innerText =
          i18n[lang].qualityLabel;
        document.getElementById("labelFormat").innerText =
          i18n[lang].formatLabel;
        document.getElementById("labelAudioOnly").innerText =
          i18n[lang].audioOnly;
        document.getElementById("labelDownloadDir").innerText =
          i18n[lang].downloadDir;
        document.getElementById("submitBtn").innerText = i18n[lang].startBtn;
        document.getElementById("labelProgress").innerText =
          i18n[lang].progressLabel;
        toggleLangBtn.innerText = i18n[lang].switchTo;
        document.getElementById("url").placeholder = i18n[lang].placeholderUrl;
        document.getElementById("download_dir").placeholder =
          i18n[lang].placeholderDir;
        // Banner only exists when the server did not find ffmpeg
        const ffmpegWarning = document.getElementById("ffmpegWarning");
        if (ffmpegWarning) ffmpegWarning.innerHTML = i18n[lang].ffmpegWarning;
      }

      const toggleLangBtn = document.getElementById("toggleLangBtn");
      toggleLangBtn.addEventListener("click", () => {
        currentLang = currentLang === "en" ? "zh" : "en";
        setLanguage(currentLang);
      });
      setLanguage(currentLang);

      const form = document.getElementById("downloadForm");
      const outputDiv = document.getElementById("output");
      const submitBtn = document.getElementById("submitBtn");
      const progressBar = document.getElementById("progressBar");
      const progressText = document.getElementById("progressText");
      const progressArea = document.getElementById("progressArea");
      const chooseDirBtn = document.getElementById("chooseDirBtn");

      // Directory picker (only some browsers support this feature)
      chooseDirBtn.addEventListener("click", async () => {
        if (window.showDirectoryPicker) {
          try {
            const dirHandle = await window.showDirectoryPicker();
            // We only retrieve the folder name; actual path is not provided by the browser
            document.getElementById("download_dir").value = dirHandle.name;
            alert(
              "Directory selected, but the browser cannot return its full path. Please ensure that directory exists on the server or enter the full path manually."
            );
          } catch (e) {
            console.error(e);
            alert("Directory selection failed or was canceled.");
          }
        } else {
          alert(
            "This browser does not support directory picking. Please enter it manually."
          );
        }
      });

      // Form submission handler
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        outputDiv.innerText = "";
        submitBtn.disabled = true;
        submitBtn.innerText =
          currentLang === "zh" ? i18n.zh.downloading : i18n.en.downloading;
        progressBar.value = 0;
        progressText.innerText = "";
        progressArea.classList.remove("hidden");

        const formData = new FormData(form);
        fetch("/download", {
          method: "POST",
          body: formData,
        })
          .then((response) => response.json())
          .then((data) => {
            if (data.status === "started" && data.job_id) {
              pollProgress(data.job_id);
            } else {
              outputDiv.innerText = data.output || "Error!";
              submitBtn.disabled = false;
              submitBtn.innerText = i18n[currentLang].startBtn;
            }
          })
          .catch((error) => {
            outputDiv.innerText = "Error: " + error;
            submitBtn.disabled = false;
            submitBtn.innerText = i18n[currentLang].startBtn;
          });
      });

      // Show a translated error with the raw yt-dlp text in a collapsible
      // block. Raw text goes through textContent: error messages can embed
      // content from the requested URL, so it must never be parsed as HTML.
      function showError(kind, rawError) {
        const dict = i18n[currentLang];
        const friendly = kind && dict.errorKinds[kind];
        progressText.innerText =
          dict.errorPrefix + (friendly || rawError || "Unknown error");
        outputDiv.innerText = "";
        if (friendly && rawError) {
          const details = document.createElement("details");
          const summary = document.createElement("summary");
          summary.textContent = dict.detailsLabel;
          summary.className = "cursor-pointer text-sm text-gray-500";
          const raw = document.createElement("div");
          raw.textContent = rawError;
          raw.className = "text-sm mt-1";
          details.appendChild(summary);
          details.appendChild(raw);
          outputDiv.appendChild(details);
        }
      }

      // Poll progress from the server using job_id
      function pollProgress(job_id) {
        // Consecutive polls answered "unknown": the job vanished (e.g. the
        // app was restarted). Give up after a bounded number instead of
        // showing "Initializing..." forever.
        let unknownPolls = 0;
        const MAX_UNKNOWN_POLLS = 15;
        const interval = setInterval(() => {
          fetch("/progress?job_id=" + job_id)
            .then((response) => response.json())
            .then((data) => {
              // We expect data to contain {status, percent, speed, eta} if status = 'downloading'
              if (data.status === "downloading") {
                unknownPolls = 0;
                let percent = data.percent || 0;
                // Ensure percent is between 0 and 100
                if (percent < 0) percent = 0;
                if (percent > 100) percent = 100;

                progressBar.value = percent;

                let speedStr = data.speed
                  ? Math.floor(data.speed / 1024) + " KiB/s"
                  : "";
                let etaStr = data.eta ? " ETA " + formatTime(data.eta) : "";

                progressText.innerText = percent + "% " + speedStr + etaStr;
              } else if (data.status === "finished") {
                // Download is finished
                progressBar.value = 100;
                progressText.innerText =
                  currentLang === "zh" ? i18n.zh.completed : i18n.en.completed;
                clearInterval(interval);
                submitBtn.disabled = false;
                submitBtn.innerText = i18n[currentLang].startBtn;
              } else if (data.status === "error") {
                // An error occurred
                showError(data.error_kind, data.error);
                clearInterval(interval);
                submitBtn.disabled = false;
                submitBtn.innerText = i18n[currentLang].startBtn;
              } else if (data.status === "unknown") {
                // Job the server doesn't know about (restarted app?)
                unknownPolls++;
                if (unknownPolls >= MAX_UNKNOWN_POLLS) {
                  progressText.innerText = i18n[currentLang].jobNotFound;
                  clearInterval(interval);
                  submitBtn.disabled = false;
                  submitBtn.innerText = i18n[currentLang].startBtn;
                } else {
                  progressText.innerText = i18n[currentLang].initializing;
                }
              } else {
                // For status = 'started' or 'init'
                unknownPolls = 0;
                progressText.innerText = i18n[currentLang].initializing;
              }
            })
            .catch((err) => {
              progressText.innerText = i18n[currentLang].errorPrefix + err;
              clearInterval(interval);
              submitBtn.disabled = false;
              submitBtn.innerText = i18n[currentLang].startBtn;
            });
        }, 1000);
      }
    </script>
  </body>
</html>
