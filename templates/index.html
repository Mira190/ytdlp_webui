<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YT-DLP Web UI Downloader</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <div class="card">
      <!-- Language toggle button -->
      <div class="toolbar">
        <button type="button" id="toggleLangBtn" class="btn-secondary" data-i18n="switchTo">
          Switch to Chinese
        </button>
      </div>
      <h1 data-i18n="title">YT-DLP Downloader</h1>
      {% if not ffmpeg_available %}
      <div class="banner-warning" data-i18n="ffmpegMissing">
        ffmpeg not found. MP3 extraction will fail and video downloads are limited to single-file
        formats (usually 720p or lower). Install ffmpeg and add it to PATH.
      </div>
      {% endif %}
      <form id="downloadForm">
        <div class="field">
          <label for="url" data-i18n="linkLabel">Video URL</label>
          <input
            type="url"
            id="url"
            name="url"
            placeholder="Enter video URL"
            data-i18n-placeholder="placeholderUrl"
            required
          />
        </div>
        <div class="field">
          <label for="quality" data-i18n="qualityLabel">Video Quality</label>
          <select id="quality" name="quality">
            {% for opt in quality_options %}
            <option value="{{ opt }}" {% if opt == 'best' %}data-i18n="qualityBest"{% endif %}>
              {{ opt|capitalize }}
            </option>
            {% endfor %}
          </select>
        </div>
        <div class="field">
          <label for="file_format" data-i18n="formatLabel">File Format</label>
          <select id="file_format" name="file_format">
            {% for fmt in format_options %}
            <option value="{{ fmt }}" {% if fmt == 'default' %}data-i18n="formatDefault"{% endif %}>
              {{ fmt|upper if fmt != 'default' else 'Default' }}
            </option>
            {% endfor %}
          </select>
        </div>
        <div class="field checkbox-field">
          <input type="checkbox" id="audio_only" name="audio_only" />
          <label for="audio_only" data-i18n="audioOnly">Audio Only (Convert to MP3)</label>
        </div>
        <div class="field">
          <label for="download_dir" data-i18n="downloadDir">Download Directory</label>
          <input
            type="text"
            id="download_dir"
            name="download_dir"
            value="{{ default_download_dir }}"
            placeholder="e.g. C:\Downloads or /home/user/Downloads"
            data-i18n-placeholder="placeholderDir"
          />
          <p class="hint" data-i18n="dirHint">Leave as is to use the default folder</p>
        </div>
        <button type="submit" id="submitBtn" class="btn-primary">Start Download</button>
      </form>
      <!-- Download progress area -->
      <div id="progressArea" class="progress-area hidden">
        <label for="progressBar" data-i18n="progressLabel">Download Progress</label>
        <progress id="progressBar" value="0" max="100"></progress>
        <div id="progressText" class="progress-text"></div>
        <div id="progressFile" class="progress-file"></div>
      </div>
      <!-- Error output -->
      <div id="output" class="output"></div>
    </div>

    <script>
      const POLL_INTERVAL_MS = 1000;
      const MAX_UNKNOWN_POLLS = 5;

      const i18n = {
        en: {
          title: "YT-DLP Downloader",
          switchTo: "Switch to Chinese",
          ffmpegMissing:
            "ffmpeg not found. MP3 extraction will fail and video downloads are limited to single-file formats (usually 720p or lower). Install ffmpeg and add it to PATH.",
          linkLabel: "Video URL",
          placeholderUrl: "Enter video URL",
          qualityLabel: "Video Quality",
          qualityBest: "Best",
          formatLabel: "File Format",
          formatDefault: "Default",
          audioOnly: "Audio Only (Convert to MP3)",
          downloadDir: "Download Directory",
          placeholderDir: "e.g. C:\\Downloads or /home/user/Downloads",
          dirHint: "Leave as is to use the default folder",
          startBtn: "Start Download",
          progressLabel: "Download Progress",
          downloading: "Downloading...",
          initializing: "Initializing...",
          processing: "Processing (merging / converting)...",
          completed: "Download Completed",
          errorPrefix: "Error: ",
          unknownError: "Unknown error",
          unknownJob: "Download job not found. It may have expired or the server was restarted.",
          networkError: "Network error: ",
        },
        zh: {
          title: "YT-DLP 下载器",
          switchTo: "切换到英语",
          ffmpegMissing:
            "未找到 ffmpeg。无法提取 MP3，视频只能下载单文件格式（通常不超过 720p）。请安装 ffmpeg 并将其加入 PATH。",
          linkLabel: "视频链接",
          placeholderUrl: "请输入视频链接",
          qualityLabel: "视频质量",
          qualityBest: "最佳",
          formatLabel: "下载格式",
          formatDefault: "默认",
          audioOnly: "仅下载音频（转为 MP3）",
          downloadDir: "下载目录",
          placeholderDir: "例如：C:\\Downloads 或 /home/user/Downloads",
          dirHint: "留空则使用默认目录",
          startBtn: "开始下载",
          progressLabel: "下载进度",
          downloading: "下载中...",
          initializing: "初始化...",
          processing: "处理中（合并 / 转换）...",
          completed: "下载完成",
          errorPrefix: "错误：",
          unknownError: "未知错误",
          unknownJob: "找不到下载任务，可能已过期或服务已重启。",
          networkError: "网络错误：",
        },
      };

      const form = document.getElementById("downloadForm");
      const outputDiv = document.getElementById("output");
      const submitBtn = document.getElementById("submitBtn");
      const progressBar = document.getElementById("progressBar");
      const progressText = document.getElementById("progressText");
      const progressFile = document.getElementById("progressFile");
      const progressArea = document.getElementById("progressArea");
      const toggleLangBtn = document.getElementById("toggleLangBtn");

      let busy = false;
      let currentLang = initialLanguage();

      function t(key) {
        return i18n[currentLang][key];
      }

      function initialLanguage() {
        try {
          const saved = localStorage.getItem("lang");
          if (saved === "en" || saved === "zh") return saved;
        } catch (e) {
          // localStorage unavailable (e.g. privacy mode); fall through.
        }
        const userLang = navigator.language || navigator.userLanguage || "en";
        return userLang.toLowerCase().startsWith("zh") ? "zh" : "en";
      }

      function applyLanguage() {
        document.documentElement.lang = currentLang === "zh" ? "zh-CN" : "en";
        document.querySelectorAll("[data-i18n]").forEach((el) => {
          el.innerText = t(el.dataset.i18n);
        });
        document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => {
          el.placeholder = t(el.dataset.i18nPlaceholder);
        });
        submitBtn.innerText = busy ? t("downloading") : t("startBtn");
      }

      toggleLangBtn.addEventListener("click", () => {
        currentLang = currentLang === "en" ? "zh" : "en";
        try {
          localStorage.setItem("lang", currentLang);
        } catch (e) {
          // Ignore: the choice just won't be remembered.
        }
        applyLanguage();
      });
      applyLanguage();

      function setBusy(value) {
        busy = value;
        submitBtn.disabled = value;
        submitBtn.innerText = value ? t("downloading") : t("startBtn");
      }

      // Format seconds into hh:mm:ss
      function formatTime(seconds) {
        const secNum = Math.max(0, Math.floor(seconds));
        const hours = Math.floor(secNum / 3600);
        const minutes = Math.floor((secNum % 3600) / 60);
        const secs = secNum % 60;
        return [hours, minutes, secs].map((n) => String(n).padStart(2, "0")).join(":");
      }

      // Format a byte count as B / KiB / MiB / GiB
      function formatBytes(n) {
        const units = ["B", "KiB", "MiB", "GiB"];
        let value = Number(n) || 0;
        let i = 0;
        while (value >= 1024 && i < units.length - 1) {
          value /= 1024;
          i++;
        }
        return (i === 0 ? value : value.toFixed(1)) + " " + units[i];
      }

      function describeDownloading(data) {
        const parts = [(data.percent || 0) + "%"];
        if (data.total_bytes) {
          parts.push(formatBytes(data.downloaded_bytes) + "/" + formatBytes(data.total_bytes));
        } else if (data.downloaded_bytes) {
          parts.push(formatBytes(data.downloaded_bytes));
        }
        if (data.speed) parts.push(formatBytes(data.speed) + "/s");
        if (data.eta) parts.push("ETA " + formatTime(data.eta));
        return parts.join(" · ");
      }

      // Form submission handler
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        outputDiv.innerText = "";
        setBusy(true);
        progressBar.value = 0;
        progressText.innerText = "";
        progressFile.innerText = "";
        progressArea.classList.remove("hidden");

        fetch("/download", { method: "POST", body: new FormData(form) })
          .then((response) => response.json())
          .then((data) => {
            if (data.status === "started" && data.job_id) {
              progressText.innerText = t("initializing");
              pollProgress(data.job_id);
            } else {
              progressArea.classList.add("hidden");
              outputDiv.innerText = t("errorPrefix") + (data.output || t("unknownError"));
              setBusy(false);
            }
          })
          .catch((err) => {
            progressArea.classList.add("hidden");
            outputDiv.innerText = t("networkError") + err;
            setBusy(false);
          });
      });

      // Poll progress from the server using job_id. Each request is only
      // scheduled after the previous one completes, so requests never pile up.
      function pollProgress(jobId) {
        let unknownCount = 0;

        function stop(message) {
          if (message !== undefined) progressText.innerText = message;
          setBusy(false);
        }

        function poll() {
          fetch("/progress?job_id=" + encodeURIComponent(jobId))
            .then((response) =>
              response.json().then((data) => ({ httpStatus: response.status, data }))
            )
            .then(({ httpStatus, data }) => {
              if (httpStatus === 404 || data.status === "unknown") {
                unknownCount++;
                if (unknownCount >= MAX_UNKNOWN_POLLS) {
                  stop(t("errorPrefix") + t("unknownJob"));
                  return;
                }
                setTimeout(poll, POLL_INTERVAL_MS);
                return;
              }
              unknownCount = 0;

              if (data.filename) progressFile.innerText = data.filename;

              if (data.status === "downloading") {
                progressBar.value = Math.min(100, Math.max(0, data.percent || 0));
                progressText.innerText = describeDownloading(data);
              } else if (data.status === "processing") {
                progressBar.value = 100;
                progressText.innerText = t("processing");
              } else if (data.status === "finished") {
                progressBar.value = 100;
                stop(t("completed"));
                return;
              } else if (data.status === "error") {
                stop(t("errorPrefix") + (data.error || t("unknownError")));
                return;
              } else {
                // "started": the download thread has not reported yet.
                progressText.innerText = t("initializing");
              }
              setTimeout(poll, POLL_INTERVAL_MS);
            })
            .catch((err) => {
              stop(t("networkError") + err);
            });
        }

        setTimeout(poll, POLL_INTERVAL_MS);
      }
    </script>
  </body>
</html>
