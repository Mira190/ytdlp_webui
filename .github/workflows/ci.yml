name: CI

# Sanity check on every push/PR to main so breakage is caught before a
# release tag is cut, not after.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  sanity-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pyflakes

      - name: Lint
        run: python -m pyflakes main.py tests benchmarks

      - name: Tests (includes offline format-selection benchmark assertions)
        run: python -m pytest tests/ -q

      - name: Format-selection benchmark (exit code = failing combinations)
        run: python benchmarks/run_format_bench.py
