name: Build and Release Windows EXE

# Auto-release: pushing a tag like v1.2.3 builds the Windows executable
# with PyInstaller (same command documented in README.md) and publishes
# it as a GitHub Release asset. workflow_dispatch allows a manual re-run
# against an existing tag without needing a new push.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (e.g. v1.2.3)"
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --name yt-dlp-webui --add-data "templates;templates" --add-data "static;static" main.py

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/yt-dlp-webui.exe
          generate_release_notes: true
